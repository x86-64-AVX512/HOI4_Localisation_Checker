name: Сообщение об ошибке
description: Сообщить о неправильной проверке или сбое программы
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Версия LocalisationChecker
      placeholder: 0.9.6F2 Beta
    validations:
      required: true

  - type: dropdown
    id: section
    attributes:
      label: Раздел программы
      options:
        - Проверка локализации
        - Длина текстов
        - Сравнение ключей
        - Интеграция с Notepad++
        - Сборка или запуск
        - Другое
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
      description: Укажите выбранный режим и последовательность действий.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Минимальный пример
      description: >-
        По возможности приложите небольшой обезличенный фрагмент локализации.
        Не публикуйте закрытые файлы мода или личные абсолютные пути.

  - type: checkboxes
    id: privacy
    attributes:
      label: Проверка данных
      options:
        - label: Я удалил личные пути и закрытые материалы из вложений.
          required: true
